[package]
name = "tpt-zero-fsm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
homepage.workspace = true
include = ["LICENSE-MIT", "LICENSE-APACHE", "README.md", "src/**/*"]
description = "Zero-allocation, strongly-typed finite state machine builder with compile-time transition checking for no_std."
readme = "README.md"
keywords = ["fsm", "no-std", "state-machine", "type-level", "zero-cost"]
categories = ["no-std", "development-tools", "rust-patterns"]
documentation = "https://docs.rs/tpt-zero-fsm"


[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs", "--generate-link-to-definition"]
[lib]
name = "tpt_zero_fsm"

[features]
default = []
alloc = []
std = ["alloc"]

[dependencies]
tpt-zero-invariant = { path = "../tpt-zero-invariant", version = "0.1.0" }

[lints]
workspace = true


