[package]
name = "tpt-zero-eigen"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
homepage.workspace = true
include = ["LICENSE-MIT", "LICENSE-APACHE", "README.md", "src/**/*"]
description = "Eigenvalue and eigenvector computation for small fixed-size matrices in no_std, with zero external dependencies."
readme = "README.md"
keywords = ["eigen", "eigenvalue", "no-std", "linear-algebra", "matrix"]
categories = ["no-std", "algorithms", "mathematics", "science"]
documentation = "https://docs.rs/tpt-zero-eigen"


[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs", "--generate-link-to-definition"]
[lib]
name = "tpt_zero_eigen"

[features]
default = []

[dependencies]
tpt-zero-tensor = { path = "../tpt-zero-tensor", version = "0.1.0" }
tpt-zero-linalg = { path = "../tpt-zero-linalg", version = "0.1.0" }
tpt-zero-decomp = { path = "../tpt-zero-decomp", version = "0.1.0" }
tpt-zero-solver = { path = "../tpt-zero-solver", version = "0.1.0" }
out-zero-float = { path = "../out-zero-float", version = "0.1.0" }

[lints]
workspace = true

[dev-dependencies]
proptest = { workspace = true }

