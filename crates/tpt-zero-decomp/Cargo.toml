[package]
name = "tpt-zero-decomp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "no_std matrix decompositions (LU with partial pivoting, QR via Householder, Cholesky) over fixed-size tensors."
readme = "README.md"
keywords = ["no-std", "linalg", "decomposition", "matrix", "numerical"]
categories = ["no-std", "algorithms", "mathematics", "science"]
documentation = "https://docs.rs/tpt-zero-decomp"

[lib]
name = "tpt_zero_decomp"

[dependencies]
tpt-zero-linalg = { path = "../tpt-zero-linalg", version = "0.1.0" }
tpt-zero-tensor = { path = "../tpt-zero-tensor", version = "0.1.0" }

[features]
default = []
alloc = []
std = ["alloc"]

[lints]
workspace = true

[dev-dependencies]
proptest = { workspace = true }
