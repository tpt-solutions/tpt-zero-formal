[package]
name = "tpt-zero-decomp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
homepage.workspace = true
include = ["LICENSE-MIT", "LICENSE-APACHE", "README.md", "src/**/*"]
description = "no_std matrix decompositions (LU with partial pivoting, QR via Householder, Cholesky) over fixed-size tensors."
readme = "README.md"
keywords = ["no-std", "linalg", "decomposition", "matrix", "numerical"]
categories = ["no-std", "algorithms", "mathematics", "science"]
documentation = "https://docs.rs/tpt-zero-decomp"


[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs", "--generate-link-to-definition"]
[lib]
name = "tpt_zero_decomp"

[dependencies]
tpt-zero-linalg = { path = "../tpt-zero-linalg", version = "0.1.0" }
tpt-zero-tensor = { path = "../tpt-zero-tensor", version = "0.1.0" }

[features]
default = []

[lints]
workspace = true

[dev-dependencies]
proptest = { workspace = true }

