[package]
name = "tpt-zero-solver"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
homepage.workspace = true
include = ["LICENSE-MIT", "LICENSE-APACHE", "README.md", "src/**/*"]
description = "no_std linear system solvers: Gaussian elimination, LU/Cholesky direct solves, and Jacobi/Gauss-Seidel iteration over fixed-size tensors."
readme = "README.md"
keywords = ["no-std", "linalg", "solver", "linear-system", "numerical"]
categories = ["no-std", "algorithms", "mathematics", "science"]
documentation = "https://docs.rs/tpt-zero-solver"


[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs", "--generate-link-to-definition"]
[lib]
name = "tpt_zero_solver"

[dependencies]
tpt-zero-tensor = { path = "../tpt-zero-tensor", version = "0.1.0" }
tpt-zero-linalg = { path = "../tpt-zero-linalg", version = "0.1.0" }
tpt-zero-decomp = { path = "../tpt-zero-decomp", version = "0.1.0" }

[features]
default = []
alloc = []
std = ["alloc"]

[lints]
workspace = true

[dev-dependencies]
proptest = { workspace = true }

