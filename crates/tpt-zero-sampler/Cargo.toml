[package]
name = "tpt-zero-sampler"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
homepage.workspace = true
include = ["LICENSE-MIT", "LICENSE-APACHE", "README.md", "src/**/*"]
description = "no_std sampling algorithms for probabilistic inference: rejection, inverse-transform, and Metropolis-Hastings."
readme = "README.md"
keywords = ["sampler", "no-std", "probability", "monte-carlo", "inference"]
categories = ["no-std", "algorithms", "science"]
documentation = "https://docs.rs/tpt-zero-sampler"


[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs", "--generate-link-to-definition"]
[lib]
name = "tpt_zero_sampler"

[dependencies]
tpt-zero-rand = { path = "../tpt-zero-rand", version = "0.1.0" }
tpt-zero-prob = { path = "../tpt-zero-prob", version = "0.1.0" }
out-zero-float = { path = "../out-zero-float", version = "0.1.0" }

[features]
default = []

[lints]
workspace = true


