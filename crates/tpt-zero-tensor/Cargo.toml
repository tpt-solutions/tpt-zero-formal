[package]
name = "tpt-zero-tensor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
homepage.workspace = true
include = ["LICENSE-MIT", "LICENSE-APACHE", "README.md", "src/**/*"]
description = "Fixed-rank, const-generic tensor types backed by fixed-size arrays for no_std with zero allocation."
readme = "README.md"
keywords = ["tensor", "matrix", "no-std", "const-generic", "linear-algebra"]
categories = ["no-std", "data-structures", "mathematics", "rust-patterns"]
documentation = "https://docs.rs/tpt-zero-tensor"


[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs", "--generate-link-to-definition"]
[lib]
name = "tpt_zero_tensor"

[features]
default = []

[lints]
workspace = true

[dev-dependencies]
proptest = { workspace = true }
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "bench"
harness = false

