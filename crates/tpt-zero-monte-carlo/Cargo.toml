[package]
name = "tpt-zero-monte-carlo"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
homepage.workspace = true
include = ["LICENSE-MIT", "LICENSE-APACHE", "README.md", "src/**/*"]
description = "Monte Carlo integration and variance reduction for no_std, zero-dependency simulations."
readme = "README.md"
keywords = ["monte-carlo", "no-std", "simulation", "variance-reduction", "integration"]
categories = ["no-std", "algorithms", "mathematics", "science"]
documentation = "https://docs.rs/tpt-zero-monte-carlo"


[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs", "--generate-link-to-definition"]
[lib]
name = "tpt_zero_monte_carlo"

[dependencies]
tpt-zero-rand = { path = "../tpt-zero-rand", version = "0.1.0" }
tpt-zero-sampler = { path = "../tpt-zero-sampler", version = "0.1.0" }
tpt-zero-stats = { path = "../tpt-zero-stats", version = "0.1.0" }
out-zero-float = { path = "../out-zero-float", version = "0.1.0" }

[features]
default = []

[lints]
workspace = true

[dev-dependencies]
proptest = { workspace = true }

