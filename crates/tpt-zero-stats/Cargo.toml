[package]
name = "tpt-zero-stats"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
homepage.workspace = true
include = ["LICENSE-MIT", "LICENSE-APACHE", "README.md", "src/**/*"]
description = "no_std descriptive statistics (mean, variance, std dev, percentiles) over f64 slices and iterators."
readme = "README.md"
keywords = ["stats", "no-std", "statistics", "mean", "percentile"]
categories = ["no-std", "algorithms", "science"]
documentation = "https://docs.rs/tpt-zero-stats"


[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs", "--generate-link-to-definition"]
[lib]
name = "tpt_zero_stats"

[features]
default = []
alloc = []
std = ["alloc"]

[dependencies]
out-zero-float = { path = "../out-zero-float", version = "0.1.0" }

[lints]
workspace = true

[dev-dependencies]
proptest = { workspace = true }

