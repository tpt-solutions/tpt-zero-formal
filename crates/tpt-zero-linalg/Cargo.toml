[package]
name = "tpt-zero-linalg"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
homepage.workspace = true
include = ["LICENSE-MIT", "LICENSE-APACHE", "README.md", "src/**/*"]
description = "no_std linear algebra over fixed-size tensors: dot/cross products, vector norms, normalization, and matrix helpers."
readme = "README.md"
keywords = ["linalg", "no-std", "linear-algebra", "vector", "matrix"]
categories = ["no-std", "algorithms", "mathematics", "science"]
documentation = "https://docs.rs/tpt-zero-linalg"


[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs", "--generate-link-to-definition"]
[lib]
name = "tpt_zero_linalg"

[dependencies]
tpt-zero-tensor = { path = "../tpt-zero-tensor", version = "0.1.0" }
tpt-zero-float = { path = "../tpt-zero-float", version = "0.1.0" }

[features]
default = []

[lints]
workspace = true

[dev-dependencies]
proptest = { workspace = true }
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "bench"
harness = false

